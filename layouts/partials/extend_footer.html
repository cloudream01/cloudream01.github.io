<!-- ① Chrome Speculation Rules：鼠标悬停时提前预取同域页面 -->
<script type="speculationrules">
{
  "prefetch": [
    {
      "where": {
        "and": [
          { "href_matches": "/*" },
          { "not": { "href_matches": "/*\\?*" } },
          { "not": { "href_matches": "/search*" } }
        ]
      },
      "eagerness": "moderate"
    }
  ]
}
</script>

<!-- ② instant.page 回退方案：兼容不支持 Speculation Rules 的浏览器 -->
<script>
/*! instant.page v5.2.0 - fallback for non-Chromium browsers */
(function() {
  if (HTMLScriptElement.supports && HTMLScriptElement.supports('speculationrules')) return;
  var prefetcher = document.createElement('link');
  var isSupported = prefetcher.relList && prefetcher.relList.supports && prefetcher.relList.supports('prefetch');
  if (!isSupported) return;
  var preloaded = new Set();
  function prefetch(url) {
    if (preloaded.has(url)) return;
    preloaded.add(url);
    var link = document.createElement('link');
    link.rel = 'prefetch';
    link.href = url;
    document.head.appendChild(link);
  }
  var timer;
  document.addEventListener('pointerover', function(e) {
    var a = e.target.closest('a');
    if (!a || !a.href || a.origin !== location.origin || a.pathname === location.pathname || a.getAttribute('href').startsWith('#')) return;
    timer = setTimeout(function() { prefetch(a.href); }, 65);
  }, { passive: true });
  document.addEventListener('pointerout', function() { clearTimeout(timer); }, { passive: true });
  document.addEventListener('touchstart', function(e) {
    var a = e.target.closest('a');
    if (!a || !a.href || a.origin !== location.origin || a.pathname === location.pathname || a.getAttribute('href').startsWith('#')) return;
    prefetch(a.href);
  }, { passive: true });
})();
</script>

<!-- ③ 顶部极简加载进度条：点击瞬间给出视觉反馈 -->
<style>
#top-progress {
  position: fixed;
  top: 0; left: 0;
  height: 2px;
  width: 0%;
  background: var(--primary);
  opacity: 0;
  z-index: 99999;
  pointer-events: none;
  transition: width 0.3s cubic-bezier(0.1,0.9,0.2,1), opacity 0.2s ease;
}
#top-progress.loading { opacity: 1; width: 75%; }
#top-progress.done    { width: 100%; opacity: 0; transition: width 0.15s ease, opacity 0.25s 0.1s ease; }
</style>
<div id="top-progress"></div>
<script>
(function() {
  var bar = document.getElementById('top-progress');
  if (!bar) return;
  document.addEventListener('click', function(e) {
    var a = e.target.closest('a');
    if (!a || !a.href || a.origin !== location.origin || a.target === '_blank' || a.getAttribute('href').startsWith('#')) return;
    if (a.pathname === location.pathname && a.search === location.search) return;
    bar.classList.remove('done');
    bar.classList.add('loading');
  });
  window.addEventListener('pageshow', function() {
    bar.classList.add('done');
    setTimeout(function() { bar.classList.remove('loading','done'); bar.style.width='0%'; }, 400);
  });
})();
</script>

<!-- ④ 热版本同步：发布新版后，访问到陈旧强缓存页面时静默刷新 -->
<script>
(function() {
  try {
    var meta = document.querySelector('meta[name="site-build-timestamp"]');
    if (!meta) return;
    var currentVer = parseInt(meta.getAttribute('content'), 10);
    if (!currentVer) return;
    var lastKnownVer = parseInt(localStorage.getItem('syu-site-ver'), 10) || 0;
    if (currentVer >= lastKnownVer) {
      localStorage.setItem('syu-site-ver', currentVer);
    } else {
      // 从陈旧缓存读出来的，拉取最新版
      window.location.reload();
    }
    // bfcache：前进后退时只检测版本变化，不无脑 reload
    window.addEventListener('pageshow', function(e) {
      if (!e.persisted) return;
      var storedVer = parseInt(localStorage.getItem('syu-site-ver'), 10) || 0;
      if (storedVer > currentVer) window.location.reload();
    });
  } catch(_) {}
})();
</script>

<!-- ⑤ Obsidian 语法增强：==高亮==、~删除线~、Callout 提示框、![[图片]] -->
<script>
(function() {
  var content = document.querySelector('.post-content, .md-content');
  if (!content) return;

  // Obsidian Callouts
  content.querySelectorAll('blockquote').forEach(function(bq) {
    var firstP = bq.querySelector('p');
    if (!firstP) return;
    var match = firstP.innerHTML.match(/^\[!([a-zA-Z0-9_-]+)\][ \t]*(.*)/);
    if (!match) return;
    var type = match[1].toLowerCase();
    var title = match[2] || match[1].toUpperCase();
    bq.classList.add('obsidian-callout', 'callout-' + type);
    firstP.innerHTML = '<span class="callout-title">' + title + '</span>' + firstP.innerHTML.substring(match[0].length);
  });

  // ==高亮==、~删除线~、![[图片]]
  var walker = document.createTreeWalker(content, NodeFilter.SHOW_TEXT, {
    acceptNode: function(node) {
      return (node.parentElement && (node.parentElement.closest('pre') || node.parentElement.closest('code')))
        ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT;
    }
  });
  var textNodes = [];
  while (walker.nextNode()) textNodes.push(walker.currentNode);
  textNodes.forEach(function(node) {
    var val = node.nodeValue;
    if (!val || (val.indexOf('==')===-1 && val.indexOf('~')===-1 && val.indexOf('![[') === -1)) return;
    var replaced = val
      .replace(/==([^=\n\r]+?)==/g, '<mark>$1</mark>')
      .replace(/(^|[ \t\n])(?:~~|~)([^~\n\r\s]+?)(?:~~|~|(?=[\n\r]|$))/g, '$1<del>$2</del>')
      .replace(/!\[\[([^\]|]+?\.(?:png|jpg|jpeg|gif|webp|svg|bmp))(?:\|(\d+)(?:x\d+)?)?\]\]/gi, function(m, filename, width) {
        var src = '/' + encodeURI(filename.trim());
        var w = width ? ' width="' + width + '"' : '';
        return '<img src="' + src + '"' + w + ' alt="' + filename.trim() + '" loading="lazy" decoding="async" style="max-width:100%;height:auto;border-radius:var(--radius);margin:1.5rem auto;display:block;">';
      });
    if (replaced !== val) {
      var span = document.createElement('span');
      span.innerHTML = replaced;
      node.parentNode.replaceChild(span, node);
    }
  });
})();
</script>

<!-- ⑥ hardWraps 缩进修复：将 <p> 内的 <br> 拆成独立 <p>，使首行缩进对每段都生效 -->
<script>
(function() {
  var content = document.querySelector('.post-content');
  if (!content) return;

  // 找出所有直接子 <p> 中含有 <br> 的段落
  var paras = Array.from(content.querySelectorAll(':scope > p'));
  paras.forEach(function(p) {
    if (!p.querySelector('br')) return;

    // 按 <br> 节点切割 childNodes 为多段
    var segments = [];
    var cur = [];
    p.childNodes.forEach(function(node) {
      if (node.nodeName === 'BR') {
        segments.push(cur);
        cur = [];
      } else {
        cur.push(node.cloneNode(true));
      }
    });
    if (cur.length) segments.push(cur);

    // 过滤掉全空的段（如末尾多余的 <br>）
    segments = segments.filter(function(seg) {
      return seg.some(function(n) {
        return n.nodeType === 3 ? n.textContent.trim() !== '' : true;
      });
    });

    if (segments.length <= 1) return;

    // 用新 <p> 替换原段落
    var frag = document.createDocumentFragment();
    segments.forEach(function(nodes) {
      var newP = document.createElement('p');
      nodes.forEach(function(n) { newP.appendChild(n); });
      frag.appendChild(newP);
    });
    p.parentNode.replaceChild(frag, p);
  });
})();
</script>
