<!-- 极速即时预加载：在鼠标悬停 65ms 或按下瞬间提前预取页面，点击直接命中缓存 -->
<script type="speculationrules">
{
  "prefetch": [
    {
      "where": {
        "and": [
          { "href_matches": "/*" },
          { "not": { "href_matches": "/*\\?*" } }
        ]
      },
      "eagerness": "moderate"
    }
  ]
}
</script>

<script>
/*! instant.page v5.2.0 - (C) 2019-2023 Alexandre Dieulot - https://instant.page/license */
(function() {
  var prefetcher = document.createElement('link');
  var isSupported = prefetcher.relList && prefetcher.relList.supports && prefetcher.relList.supports('prefetch');
  if (!isSupported) return;

  var preloaded = new Set();

  function prefetch(url) {
    if (preloaded.has(url)) return;
    preloaded.add(url);
    var link = document.createElement('link');
    link.rel = 'prefetch';
    link.href = url;
    document.head.appendChild(link);
  }

  var timer;
  document.addEventListener('pointerover', function(e) {
    var a = e.target.closest('a');
    if (!a || !a.href || a.origin !== location.origin || a.pathname === location.pathname || a.getAttribute('href').startsWith('#')) return;
    timer = setTimeout(function() { prefetch(a.href); }, 65);
  }, { passive: true });

  document.addEventListener('pointerout', function() {
    clearTimeout(timer);
  }, { passive: true });

  document.addEventListener('touchstart', function(e) {
    var a = e.target.closest('a');
    if (!a || !a.href || a.origin !== location.origin || a.pathname === location.pathname || a.getAttribute('href').startsWith('#')) return;
    prefetch(a.href);
  }, { passive: true });
})();
</script>

<!-- 顶部 2px 极简即时加载条：点击瞬间提供反馈，彻底告别假死等待感 -->
<style>
#top-progress {
  position: fixed;
  top: 0;
  left: 0;
  height: 2.5px;
  width: 0%;
  background: var(--primary);
  opacity: 0;
  z-index: 99999;
  pointer-events: none;
  transition: width 0.3s cubic-bezier(0.1, 0.9, 0.2, 1), opacity 0.2s ease;
}
#top-progress.loading {
  opacity: 1;
  width: 75%;
}
#top-progress.done {
  width: 100%;
  opacity: 0;
  transition: width 0.15s ease, opacity 0.25s 0.1s ease;
}
</style>
<div id="top-progress"></div>

<script>
(function() {
  var bar = document.getElementById('top-progress');
  if (!bar) return;

  document.addEventListener('click', function(e) {
    var a = e.target.closest('a');
    if (!a || !a.href) return;
    if (a.origin !== location.origin) return;
    if (a.target === '_blank') return;
    if (a.getAttribute('href').startsWith('#')) return;
    if (a.pathname === location.pathname && a.search === location.search) return;

    // 点击瞬间启动顶部指示条
    bar.classList.remove('done');
    bar.classList.add('loading');
  });

  window.addEventListener('pageshow', function() {
    bar.classList.add('done');
    setTimeout(function() {
      bar.classList.remove('loading', 'done');
      bar.style.width = '0%';
    }, 400);
  });
})();
</script>

<!-- Obsidian 语法增强：高亮 ==、单波浪删除线 ~、Callouts 提示框 -->
<script>
(function() {
  var content = document.querySelector('.post-content');
  if (!content) return;

  // 1. 处理 Obsidian Callouts 提示块 (> [!NOTE], > [!TIP], > [!WARNING] 等)
  var bqs = content.querySelectorAll('blockquote');
  bqs.forEach(function(bq) {
    var firstP = bq.querySelector('p');
    if (!firstP) return;
    var match = firstP.innerHTML.match(/^\[!([a-zA-Z0-9_-]+)\][ \t]*(.*)/);
    if (match) {
      var type = match[1].toLowerCase();
      var title = match[2] || match[1].toUpperCase();
      bq.classList.add('obsidian-callout', 'callout-' + type);
      firstP.innerHTML = '<span class="callout-title">' + title + '</span>' + firstP.innerHTML.substring(match[0].length);
    }
  });

  // 2. 安全替换非代码区域的 ==高亮== 与 ~单波浪删除线~
  var walker = document.createTreeWalker(content, NodeFilter.SHOW_TEXT, {
    acceptNode: function(node) {
      if (node.parentElement && (node.parentElement.closest('pre') || node.parentElement.closest('code'))) {
        return NodeFilter.FILTER_REJECT;
      }
      return NodeFilter.FILTER_ACCEPT;
    }
  });

  var textNodes = [];
  while (walker.nextNode()) {
    textNodes.push(walker.currentNode);
  }

  textNodes.forEach(function(node) {
    var val = node.nodeValue;
    if (!val) return;
    if (val.indexOf('==') === -1 && val.indexOf('~') === -1) return;

    var replaced = val
      // ==高亮文本== -> <mark>高亮文本</mark>
      .replace(/==([^=\n\r]+?)==/g, '<mark>$1</mark>')
      // ~单波浪删除线~ -> <del>删除线</del>
      .replace(/(^|[^\w~])~([^~\n\r\s]+?)~($|[^\w~])/g, '$1<del>$2</del>$3');

    if (replaced !== val) {
      var span = document.createElement('span');
      span.innerHTML = replaced;
      node.parentNode.replaceChild(span, node);
    }
  });
})();
</script>
