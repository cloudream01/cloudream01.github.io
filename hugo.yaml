baseURL: "https://cloudream01.github.io/"
locale: zh-cn
title: "舒逸的博客"
theme: PaperMod

# 构建优化
minify:
  disableXML: true
  minifyOutput: true

# 分页
paginate: 10

enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false
hasCJKLanguage: true

# 性能优化
outputs:
  home:
    - HTML
    - RSS
    - JSON   # 用于搜索功能

params:
  env: production
  title: "舒逸的博客"
  description: ""
  mainSections: ["study", "thoughts", "journal"]
  DateFormat: "2006年1月2日"

  # 默认主题，支持 auto / light / dark
  defaultTheme: auto
  disableThemeToggle: false

  ShowReadingTime: false
  ShowShareButtons: false
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowWordCount: true
  ShowRssButtonInSectionTermList: false
  UseHugoToc: true
  disableSpecial1stPost: true
  disableScrollToTop: false
  comments: true
  hidemeta: false
  hideSummary: false
  showtoc: false
  tocopen: false

  assets:
    disableHLJS: true
    disableFingerprinting: false
    favicon: ""
    favicon16x16: ""
    favicon32x32: ""
    apple_touch_icon: ""
    safari_pinned_tab: ""

  label:
    text: "舒逸的博客"
    icon: ""
    iconHeight: 35

  # 首页展示模式，profile 模式类似 sinyalee.com/blog
  homeInfoParams:
    Title: "云舒梦逸，行止随心"
    Content: ""

  socialIcons:
    - name: github
      url: "https://github.com/cloudream01"

  # 搜索
  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 0
    limit: 10
    keys: ["title", "permalink", "summary", "content"]

menu:
  main:
    - identifier: home
      name: 首页
      url: /
      weight: 5
    - identifier: search
      name: 搜索
      url: /search/
      weight: 10
    - identifier: tags
      name: 标签
      url: /tags/
      weight: 20
    - identifier: archives
      name: 时间线
      url: /archives/
      weight: 30
    - identifier: guestbook
      name: 留言板
      url: /guestbook/
      weight: 40

# Markdown 渲染配置
markup:
  goldmark:
    renderer:
      unsafe: true        # 允许 HTML in markdown
      hardWraps: true     # Obsidian 习惯：直接回车即换行，所见即所得
    extensions:
      strikethrough: true # 删除线
      table: true         # 表格
      taskList: true      # 任务清单 - [ ] - [x]
      typographer: false  # 避免中文标点被意外转换
      footnote: true      # 脚注
  highlight:
    noClasses: false
    anchorLineNos: true
    codeFences: true
    guessSyntax: true
    lineNos: false
    style: github-dark  # 代码高亮风格

pygmentsUseClasses: true
