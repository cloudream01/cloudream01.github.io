baseURL: "https://cloudream01.github.io/"
locale: zh-cn
title: "舒逸的博客"
theme: PaperMod

# 构建优化
minify:
  disableXML: true
  minifyOutput: true

# 分页
paginate: 10

enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false
hasCJKLanguage: true

# 性能优化
outputs:
  home:
    - HTML
    - RSS
    - JSON   # 用于搜索功能

params:
  env: production
  title: "舒逸的博客"
  description: ""
  mainSections: ["study", "thoughts", "journal"]
  DateFormat: "2006年1月2日"

  # 链接分享缩略图（og:image / twitter:image）。
  # 文件放在站点根目录 og-image.png：hugo.yaml 的 module.mounts 会把根目录的
  # *.png 直接发布到站点根路径，因此这里用「/」开头的绝对路径。
  images: ["/og-image.png"]

  # 默认主题，支持 auto / light / dark
  defaultTheme: auto
  disableThemeToggle: false

  ShowReadingTime: false
  ShowShareButtons: false
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowWordCount: true
  ShowRssButtonInSectionTermList: false
  UseHugoToc: true
  disableSpecial1stPost: true
  disableScrollToTop: false
  comments: true
  hidemeta: false
  hideSummary: false
  showtoc: false
  tocopen: false

  assets:
    disableHLJS: true
    disableFingerprinting: false
    # favicon 留空则使用 static/ 目录下的默认文件，如无文件则浏览器自动请求 /favicon.ico
    # favicon: ""
    # favicon16x16: ""
    # favicon32x32: ""
    # apple_touch_icon: ""
    # safari_pinned_tab: ""

  label:
    text: "舒逸的博客"
    # 导航栏 Logo：内联 SVG（云 + 星芒），颜色继承导航栏文字色，自动适配浅色/深色主题。
    # 由 assets/css/extended/logo.css 控制尺寸与悬停动效。
    icon: ""
    iconHeight: 32
    iconSVG: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="32" height="30" fill="currentColor" aria-hidden="true" focusable="false"><path d="M8.5 39.8L8.5 40.4L8.6 41L8.7 41.5L8.9 42.1L9.1 42.6L9.3 43.1L9.6 43.6L9.9 44.1L10.2 44.5L10.7 45L11.1 45.4L11.5 45.8L12 46.4L12.5 46.9L12.8 47.2L13.3 47.5L13.7 47.7L14.2 47.8L14.5 47.8L15 47.9L49.1 47.9L49.7 47.8L50.2 47.7L50.7 47.5L51.2 47.2L51.6 46.9L51.9 46.6L52.2 46.2L52.4 45.8L53.2 45.2L53.9 44.4L54.2 44L54.6 43.4L54.9 42.8L55.1 42.2L55.3 41.7L55.4 41L55.5 40.5L55.5 39.8L55.4 38.9L55.3 38.1L55.1 37.3L54.8 36.6L54.4 36L54 35.3L53.6 34.8L52.9 34.2L52.8 34.1L52.8 33.6L52.7 33.2L52.6 32.8L52.4 32.3L52.2 32L51.9 31.6L51.6 31.3L51.3 31.1L50.8 30.8L50.4 30.6L49.9 30.4L49.4 30.3L43.3 30.3L43.1 30.3L42.8 29.5L42.4 28.7L41.9 27.9L41.3 27.2L40.8 26.5L40.1 25.8L39.4 25.2L38.7 24.7L37.9 24.2L37.1 23.8L36.3 23.4L35.4 23.1L34.5 22.9L33.6 22.8L32.8 22.7L31.9 22.6L31 22.7L30.2 22.8L29.3 22.9L28.5 23.2L27.6 23.5L26.8 23.9L26 24.3L25.2 24.8L24.5 25.3L23.8 25.9L23.2 26.5L22.6 27.2L22.1 27.9L21.7 28.6L21.3 29.3L20.9 30.2L20.8 30.3L14.6 30.3L14.1 30.4L13.6 30.6L13.2 30.8L12.7 31.1L12.4 31.3L12.1 31.6L11.8 32L11.6 32.4L11.4 32.8L11.3 33.2L11.2 33.7L11.2 34.1L10.5 34.7L10.1 35.3L9.6 35.9L9.2 36.6L8.9 37.3L8.7 38.2L8.5 39Z"/><path d="M44.6 21.5L47 20.5L48 18.1L49 20.5L51.4 21.5L49 22.5L48 24.9L47 22.5Z"/></svg>'

  # 首页展示模式，profile 模式类似 sinyalee.com/blog
  homeInfoParams:
    Title: "云舒梦逸，行止随心"
    Content: ""

  socialIcons:
    - name: github
      url: "https://github.com/cloudream01"

  # 搜索
  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 0
    limit: 10
    keys: ["title", "permalink", "summary", "content"]

menu:
  main:
    - identifier: home
      name: 首页
      url: /
      weight: 5
    - identifier: search
      name: 搜索
      url: /search/
      weight: 10
    - identifier: tags
      name: 标签
      url: /tags/
      weight: 20
    - identifier: archives
      name: 时间线
      url: /archives/
      weight: 30
    - identifier: guestbook
      name: 留言板
      url: /guestbook/
      weight: 40

# Markdown 渲染配置
markup:
  goldmark:
    renderer:
      unsafe: true        # 允许 HTML in markdown
      hardWraps: true     # Obsidian 习惯：直接回车即换行，所见即所得
    extensions:
      strikethrough: true # 删除线
      table: true         # 表格
      taskList: true      # 任务清单 - [ ] - [x]
      typographer: false  # 避免中文标点被意外转换
      footnote: true      # 脚注
  highlight:
    noClasses: false
    anchorLineNos: true
    codeFences: true
    guessSyntax: true
    lineNos: false
    style: github-dark  # 代码高亮风格

pygmentsUseClasses: true

# 模块挂载：自动将根目录和 static 目录下的所有图片打包发布
module:
  mounts:
    - source: static
      target: static
    - source: content
      target: content
    - source: layouts
      target: layouts
    - source: assets
      target: assets
    - source: .
      target: static
      files: ["*.png", "*.jpg", "*.jpeg", "*.webp", "*.gif", "*.svg"]
